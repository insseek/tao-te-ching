<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>里探《道德经》新编</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="里探《道德经》新编 原文·解字·译文·评说">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="_media/favicon.jpg">
  <!-- Docsify v5 核心主题 -->
  <link rel="stylesheet" href="_style/docsify@5-themes-core.min.css">
  <!-- 深色模式附加样式：默认跟随系统，可用右下角按钮手动切换 -->
  <link id="theme-dark" rel="stylesheet" href="_style/docsify@5-themes-core-dark.min.css"
    media="(prefers-color-scheme: dark)">
  <!-- 站点自定义样式 -->
  <link rel="stylesheet" href="_style/site.css">
  <!-- 右下角主题按钮 / 公众号二维码样式 -->
  <link rel="stylesheet" href="_style/custom.css">

  <script>
    // 首屏渲染前恢复上次选择的主题，避免闪烁；没有记录时跟随系统
    (() => {
      try {
        const saved = localStorage.getItem('docsify-theme');
        if (saved === 'dark' || saved === 'light') {
          document.getElementById('theme-dark').media =
            saved === 'dark' ? 'all' : 'not all';
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {
        /* localStorage 不可用时忽略 */
      }
    })();
  </script>
</head>

<body class="loading sidebar-chevron-right">
  <div id="app"></div>

  <!-- 右下角悬浮控件（主题切换 / 公众号二维码，由脚本填充） -->
  <div id="app-controls" class="app-controls"></div>

  <script>
    window.$docsify = {
      name: '里探《道德经》新编',
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',
      subMaxLevel: 2,
      coverpage: true,
      search: {
        placeholder: '搜索',
        paths: 'auto',
        depth: 2,
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
        crossChapterText: true,
      },
      // 微信公众号二维码：填写 qrcode 后显示右下角按钮
      wechat: {
        qrcode: '_media/wechat-qr.jpg',
        text: '微信扫码　关注「里探」',
      },
      plugins: [
        /* 定位到指定标题（天道星图抽屉里的「在新编中阅读」用它跳到当前组）。
           docsify 自带 ?id= 在本站不生效——它在异步渲染完成前就去查元素，
           查不到便不滚动。改挂 doneEach：渲染完再滚。 */
        function (hook) {
          hook.afterEach(function (html) {
            /* 显示层把句尾（章号）排成上标。数据始终是纯文本，
               只在渲染后的 HTML 上替换——这样 .md 里不会有任何标签。 */
            return html.replace(/（([一二三四五六七八九十]+)）/g,
              '<sup class="cn">（$1）</sup>');
          });
          hook.doneEach(function () {
            var m = /[?&]id=([^&]+)/.exec(location.hash);
            if (!m) return;
            var id = decodeURIComponent(m[1]);
            /* 滚三次：字体、图片晚到会把内容撑开，只滚一次会跑偏
               （实测一次不够，标题会落到视口上方 76px） */
            var go = function () {
              var el = document.getElementById(id);
              if (!el) return;
              el.scrollIntoView({ block: 'start' });
              window.scrollBy(0, -18);   /* 留一点上边距 */
            };
            setTimeout(go, 30);
            setTimeout(go, 260);
            setTimeout(go, 720);
          });
        }
      ],
    }
  </script>
  <!-- Docsify v5.0.0 本体（必须最先加载） -->
  <script src="_script/docsify@5.min.js"></script>
  <!-- 全文搜索插件 -->
  <script src="_script/docsify-search@5.min.js"></script>
  <!-- 分页插件 -->
  <script src="_script/docsify-pagination@2.10.1.min.js"></script>
  <!-- 深色模式切换（右下角按钮，双击恢复跟随系统） -->
  <script src="_script/theme-toggle.js"></script>
  <!-- 微信公众号二维码（读取 $docsify.wechat 配置） -->
  <script src="_script/wechat.js"></script>
</body>

</html>
