<!DOCTYPE html>
<html lang="zh-CN" class="tdn-html">

<head>
  <meta charset="UTF-8">
  <title>天道星图 · 天网恢恢，疏而不失 · 里探《道德经》新编</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="天道星图：里探《道德经》新编关系图。中心为道，向外四环即四部，22 组为节点；源→用为实线，原文共章为虚弦。天网恢恢，疏而不失。">
  <link rel="icon" href="_media/favicon.jpg">
  <link rel="stylesheet" href="_style/tiandao-net.css">
</head>

<body class="tdn-standalone">
  <div class="tdn-wrap" id="tiandao-net"></div>

  <a class="tdn-back" href="index.html#/00">← 返回《里探《道德经》新编》</a>
  <button class="tdn-rot" id="tdn-rot" type="button" aria-label="切换横屏">
    <!-- 目标方向：未旋转时指向横屏 -->
    <svg class="i-land" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.7" y="7.5" width="18.6" height="9" rx="2.3"/>
      <path d="M6.8 4.7A9.5 9.5 0 0 1 17.5 5.3"/>
      <path d="M18 2v3.5h-3.5"/>
    </svg>
    <!-- 已旋转时指向竖屏 -->
    <svg class="i-port" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="7.5" y="2.7" width="9" height="18.6" rx="2.3"/>
      <path d="M4.7 17.2A9.5 9.5 0 0 1 5.3 6.5"/>
      <path d="M2 6h3.5v3.5"/>
    </svg>
  </button>

  <script src="_script/tiandao-net.js"></script>
  <script>
    /* 竖屏手机：把整块界面旋转 90°，以横屏姿态铺满。
       iOS Safari／微信均不支持锁定屏幕方向，故用 CSS 旋转。
       另：紧凑模式由 JS 统一加 tdn-compact —— 媒体查询看的是视口，
       而旋转后的框是竖屏视口尺寸，媒体查询判断不到。 */
    (function () {
      var body = document.body;
      var btn = document.getElementById('tdn-rot');
      var mq = window.matchMedia('(max-height: 560px)');
      function sync() {
        var rot = body.classList.contains('tdn-rot-on');
        body.classList.toggle('tdn-compact', rot || mq.matches);
        if (btn) btn.setAttribute('aria-label', rot ? '切换竖屏' : '切换横屏');
      }
      if (btn) {
        btn.addEventListener('click', function () {
          body.classList.toggle('tdn-rot-on');
          sync();
        });
      }
      if (mq.addEventListener) mq.addEventListener('change', sync);
      else if (mq.addListener) mq.addListener(sync);
      window.addEventListener('orientationchange', function () { setTimeout(sync, 60); });
      sync();
    })();
  </script>
</body>

</html>
